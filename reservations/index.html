<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Shack - Reservations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <h1 class="app-title">Reservations</h1>
          <span class="reservation-count" id="reservationCount"
            >0 reservations</span
          >
        </div>
        <div class="header-right">
          <!-- Sync Status Indicator -->
          <div class="sync-status" id="syncStatus" title="Sync Status">
            <svg
              id="syncOkIcon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#27ae60"
              stroke-width="2"
              style="display: none"
            >
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <svg
              id="syncWarnIcon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#ff9500"
              stroke-width="2"
              style="display: none"
            >
              <path
                d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
              ></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </div>
          <!-- JSON File Operations -->
          <div class="json-operations">
            <button
              class="btn-secondary"
              id="importJsonBtn"
              title="Import from JSON file"
            >
              <svg
                id="importJsonIcon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>Import</span>
            </button>
            <button
              class="btn-secondary"
              id="exportJsonBtn"
              title="Export to JSON file"
            >
              <svg
                id="exportJsonIcon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <span>Export</span>
            </button>

            <button
              class="btn-secondary"
              id="syncJsonBtn"
              title="Check sync status (local vs JSON)"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path
                  d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
                ></path>
              </svg>
              <span>Sync</span>
            </button>
          </div>
          <!-- Tab-Glider Toggle Switch -->
          <div class="view-toggle">
            <button class="toggle-btn" id="listViewBtn" aria-label="List View">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
              </svg>
              <span>List</span>
            </button>
            <button
              class="toggle-btn"
              id="cardsViewBtn"
              aria-label="Cards View"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
              <span>Cards</span>
            </button>
            <div class="toggle-slider" id="toggleSlider"></div>
          </div>
          <button class="btn-primary" id="newReservationBtn">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            New Reservation
          </button>
        </div>
      </header>

      <!-- Filter & Sort Menu -->
      <div class="app-menu">
        <div class="menu-section">
          <label class="menu-label" for="sortSelect">Sort:</label>
          <select
            id="sortSelect"
            class="menu-select"
            aria-label="Sort reservations"
          >
            <option value="date-desc">Date (Newest First)</option>
            <option value="date-asc" selected>Date (Oldest First)</option>
            <option value="name-asc">Name (A-Z)</option>
            <option value="name-desc">Name (Z-A)</option>
            <option value="price-desc">Price (High to Low)</option>
            <option value="price-asc">Price (Low to High)</option>
          </select>
        </div>

        <div class="menu-section">
          <button id="toggleCompletedBtn" class="menu-toggle-btn">
            Show Completed
          </button>
        </div>

        <div class="menu-section menu-stats">
          <span id="visibleCount">0</span> /
          <span id="totalCount">0</span> reservations
        </div>
      </div>

      <!-- Main Content - Reservations Container -->
      <!-- The data-render attribute controls the view mode via CSS -->
      <main
        class="reservations-container"
        id="reservationsContainer"
        data-render="list"
      >
        <!-- Reservations will be dynamically rendered here -->
        <div class="empty-state" id="emptyState">
          <svg
            width="64"
            height="64"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <h3>No Reservations Yet</h3>
          <p>Create your first reservation to get started.</p>
          <button class="btn-primary" id="emptyStateBtn">
            Create Reservation
          </button>
        </div>
      </main>
    </div>

    <!-- Side Sheet for Reservation Details -->
    <aside class="side-sheet" id="sideSheet">
      <div class="side-sheet-overlay" id="sideSheetOverlay"></div>
      <div class="side-sheet-content">
        <button class="side-sheet-close" id="sideSheetClose">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div class="side-sheet-body" id="sideSheetBody">
          <!-- Reservation details will be rendered here -->
        </div>
      </div>
    </aside>

    <!-- New Reservation Modal -->
    <div class="modal" id="reservationModal">
      <div class="modal-overlay" id="modalOverlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>New Reservation</h2>
          <div
            class="header-actions"
            style="display: flex; gap: 12px; align-items: center"
          >
            <button
              type="submit"
              form="reservationForm"
              class="btn-primary"
              style="padding: 8px 16px"
            >
              Update Reservation
            </button>
            <button type="button" class="modal-close" id="modalClose">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
        <form class="reservation-form" id="reservationForm">
          <!-- Contact Information -->
          <fieldset class="form-section">
            <legend>Contact Information</legend>
            <div class="form-grid">
              <div class="form-group">
                <label for="contactName">Contact Name *</label>
                <input
                  type="text"
                  id="contactName"
                  name="contactName"
                  required
                  placeholder="Full name"
                />
              </div>
              <div class="form-group">
                <label for="contactPhone">Phone</label>
                <input
                  type="tel"
                  id="contactPhone"
                  name="contactPhone"
                  placeholder="+1 234 567 8900"
                />
              </div>
              <div class="form-group">
                <label for="contactEmail">Email</label>
                <input
                  type="email"
                  id="contactEmail"
                  name="contactEmail"
                  placeholder="email@example.com"
                />
              </div>
              <div class="form-group">
                <label for="reservationSource">Source</label>
                <select id="reservationSource" name="reservationSource">
                  <option value="Contacto Directo">Contacto Directo</option>
                  <option value="Website">Website</option>
                  <option value="Phone">Phone</option>
                  <option value="Email">Email</option>
                  <option value="Referral">Referral</option>
                  <option value="TripAdvisor">TripAdvisor</option>
                  <option value="Viator">Viator</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>
          </fieldset>

          <!-- Reservation Details -->
          <fieldset class="form-section">
            <legend>Reservation Details</legend>
            <div class="form-grid">
              <div class="form-group">
                <label for="guestName">Guest Name *</label>
                <input
                  type="text"
                  id="guestName"
                  name="guestName"
                  required
                  placeholder="Guest name"
                  class="highlight-gold"
                />
              </div>
              <div class="form-group">
                <label for="tourName">Tour Name</label>
                <select id="tourName" name="tourName">
                  <option value="SNORKEL">SNORKEL</option>
                  <option value="YACHT">YACHT</option>
                  <option value="FISHING HALF DAY">FISHING HALF DAY</option>
                  <option value="FISHING FULL DAY">FISHING FULL DAY</option>
                  <option value="SUNSET">SUNSET</option>
                  <option value="BIRTHDAY">BIRTHDAY</option>
                  <option value="PRIVATE">PRIVATE</option>
                </select>
              </div>
              <div class="form-group">
                <label for="reservationDate">Date *</label>
                <input
                  type="date"
                  id="reservationDate"
                  name="reservationDate"
                  required
                />
              </div>
              <div class="form-group">
                <label for="reservationTime">Time *</label>
                <input
                  type="time"
                  id="reservationTime"
                  name="reservationTime"
                  required
                />
              </div>
              <div class="form-group">
                <label for="reservationHours">Hours *</label>
                <select id="reservationHours" name="reservationHours" required>
                  <option value="2">2 Hours</option>
                  <option value="3">3 Hours</option>
                  <option value="4" selected>4 Hours</option>
                  <option value="5">5 Hours</option>
                  <option value="6">6 Hours</option>
                  <option value="7">7 Hours</option>
                  <option value="8">8 Hours</option>
                </select>
              </div>
              <div class="form-group">
                <label for="agentCode">Agent</label>
                <select id="agentCode" name="agentCode">
                  <option value="IG">Ivan Gonzalez</option>
                  <option value="DR">Daniel Rios</option>
                </select>
              </div>
            </div>
          </fieldset>

          <!-- Passengers -->
          <fieldset class="form-section">
            <legend>Passengers</legend>
            <div class="form-grid passengers-grid">
              <div class="form-group">
                <label for="adults">Adults *</label>
                <input
                  type="number"
                  id="adults"
                  name="adults"
                  min="1"
                  max="55"
                  value="1"
                  required
                />
              </div>
              <div class="form-group">
                <label for="kids">Kids (5-11)</label>
                <input
                  type="number"
                  id="kids"
                  name="kids"
                  min="0"
                  max="50"
                  value="0"
                />
              </div>
              <div class="form-group">
                <label for="infants">Infants (0-4)</label>
                <input
                  type="number"
                  id="infants"
                  name="infants"
                  min="0"
                  max="50"
                  value="0"
                />
              </div>
              <div class="form-group">
                <label for="extraPax">Extra Passengers</label>
                <input
                  type="number"
                  id="extraPax"
                  name="extraPax"
                  min="0"
                  max="50"
                  value="0"
                />
              </div>
            </div>
          </fieldset>

          <!-- Food & Beverage -->
          <fieldset class="form-section">
            <legend>Food & Beverage</legend>
            <div class="form-grid">
              <div class="form-group">
                <label for="foodOption">Food Option</label>
                <select id="foodOption" name="foodOption">
                  <option value="MEXICAN BUFFET & NATIONAL OPEN BAR">
                    Mexican Buffet & National Open Bar
                  </option>
                  <option value="BUFFET ONLY">Buffet Only</option>
                  <option value="BOX LUNCH">Box Lunch</option>
                  <option value="NONE">None</option>
                </select>
              </div>
              <div class="form-group">
                <label for="hotel">Hotel</label>
                <input
                  type="text"
                  id="hotel"
                  name="hotel"
                  placeholder="Hotel name"
                />
              </div>
            </div>
          </fieldset>

          <!-- Pricing -->
          <fieldset class="form-section">
            <legend>Pricing</legend>
            <div class="form-grid">
              <div class="form-group">
                <label for="hourlyRate">Hourly Rate ($)</label>
                <input
                  type="text"
                  id="hourlyRate"
                  name="hourlyRate"
                  inputmode="decimal"
                  value="600"
                />
              </div>
              <div class="form-group">
                <label for="basePrice">Base Price ($)</label>
                <input
                  type="text"
                  id="basePrice"
                  name="basePrice"
                  inputmode="decimal"
                  readonly
                />
              </div>
              <div class="form-group">
                <label for="extraPassengerFee">Extra Passenger Fee ($)</label>
                <input
                  type="text"
                  id="extraPassengerFee"
                  name="extraPassengerFee"
                  inputmode="decimal"
                  value="100"
                />
              </div>
              <div class="form-group">
                <label for="totalPrice">Total Price ($)</label>
                <input
                  type="text"
                  id="totalPrice"
                  name="totalPrice"
                  inputmode="decimal"
                  readonly
                />
              </div>
              <div class="form-group">
                <label for="deposit">Deposit ($)</label>
                <input
                  type="text"
                  id="deposit"
                  name="deposit"
                  inputmode="decimal"
                  value="0"
                />
              </div>
              <div class="form-group">
                <label for="balance">Balance ($)</label>
                <input
                  type="text"
                  id="balance"
                  name="balance"
                  inputmode="decimal"
                  readonly
                />
              </div>
              <div class="form-group">
                <label for="paymentMethod">Payment Method</label>
                <select id="paymentMethod" name="paymentMethod">
                  <option value="CASH">Cash</option>
                  <option value="CARD">Card</option>
                  <option value="TRANSFER">Transfer</option>
                  <option value="PAYPAL">PayPal</option>
                </select>
              </div>
              <!-- Extra Cost Title -->
              <div class="form-group">
                <label for="extraCostTitle">Extra Cost Title</label>
                <input
                  type="text"
                  id="extraCostTitle"
                  name="extraCostTitle"
                  placeholder="e.g., Booking.com 15%"
                />
              </div>
              <!-- Extra Cost Amount -->
              <div class="form-group">
                <label for="extraCostAmount">Extra Cost Amount ($)</label>
                <input
                  type="text"
                  id="extraCostAmount"
                  name="extraCostAmount"
                  placeholder="0.00"
                  inputmode="decimal"
                />
              </div>
              <!-- Extra Cost Description -->
              <div class="form-group full-width">
                <label for="extraCostDescription">Extra Cost Description</label>
                <textarea
                  id="extraCostDescription"
                  name="extraCostDescription"
                  rows="2"
                  placeholder="Description of the extra cost..."
                ></textarea>
              </div>
              <!-- Price Adjustment -->
              <div class="form-group">
                <label for="priceAdjustment">Ajuste de Precio ($)</label>
                <input
                  type="text"
                  id="priceAdjustment"
                  name="priceAdjustment"
                  placeholder="0.00 or -50.00"
                  inputmode="decimal"
                />
              </div>
              <!-- Price Adjustment Note -->
              <div class="form-group full-width">
                <label for="priceAdjustmentNote">Nota de Ajuste</label>
                <textarea
                  id="priceAdjustmentNote"
                  name="priceAdjustmentNote"
                  rows="2"
                  placeholder="Detalles sobre el ajuste especial/negociado..."
                ></textarea>
              </div>
              <!-- Crew Tips Toggle -->
              <div class="form-group">
                <label class="checkbox-label">
                  <input
                    type="checkbox"
                    id="crewTipsEnabled"
                    name="crewTipsEnabled"
                    checked
                  />
                  <span>Show Crew Tips Message</span>
                </label>
              </div>
            </div>
          </fieldset>

          <!-- Notes -->
          <fieldset class="form-section">
            <legend>Additional Information</legend>
            <div class="form-group full-width">
              <label for="notes">Notes</label>
              <textarea
                id="notes"
                name="notes"
                rows="3"
                placeholder="Special requests, dietary restrictions, etc."
              ></textarea>
            </div>
          </fieldset>
        </form>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
