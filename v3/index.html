<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Love Shack Cruises — Reservation & Quotation System v3">

  <link rel="icon" href="https://www.loveshackcruises.com/wp-content/uploads/2020/06/Recurso-5.png" sizes="192x192">
  <link rel="apple-touch-icon" href="https://www.loveshackcruises.com/wp-content/uploads/2020/06/Recurso-5.png">

  <title>Love Shack Cruises — Reservations v3</title>

  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/stepper.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-shell">

    <!-- ===== Header ===== -->
    <header class="app-header" id="app-header">
      <span class="header-title">⛵ Love Shack</span>
    </header>

    <!-- ===== Main Content ===== -->
    <main class="app-main">
      <div id="app" data-behavior="hydrate-screens">
        <!-- Screens are rendered here by the router -->
      </div>
    </main>

    <!-- ===== Bottom Navigation ===== -->
    <nav class="bottom-nav" id="bottom-nav">
      <!-- Dynamic navigation rendered by bottom-nav.js -->
    </nav>

    <!-- ===== FAB ===== -->
    <button class="fab" id="fab" aria-label="New Quote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

    <!-- ===== Toast Container ===== -->
    <div id="toast-container"></div>

  </div>

  <!-- ===== JavaScript ===== -->
  <!-- Business Logic (pricing engine) -->
  <script src="js/pricing-rules.js"></script>
  <script src="js/pricing-calculator.js"></script>

  <!-- Storage -->
  <script src="js/storage.js"></script>

  <!-- UI Components -->
  <script src="js/components/toast.js"></script>
  <script src="js/components/fab.js"></script>
  <script src="js/components/bottom-nav.js"></script>
  <script src="js/components/stepper-bar.js"></script>

  <!-- Screens -->
  <script src="js/screens/dashboard.js"></script>
  <script src="js/screens/step1-pricing.js"></script>
  <script src="js/screens/step2-details.js"></script>
  <script src="js/screens/step3-adjustments.js"></script>

  <!-- App Orchestrator (must be last) -->
  <script src="js/app.js"></script>
</body>
</html>
